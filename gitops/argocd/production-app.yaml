apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devopsify-prod
  namespace: argocd
  labels:
    environment: prod
    app.kubernetes.io/name: devopsify-ecommerce
    tier: production
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: devopsify-project
  source:
    repoURL: https://github.com/SenudaJK/devopsify-ecommerce.git
    targetRevision: master
    path: gitops/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: devopsify-prod
  syncPolicy:
    # Manual sync for production - requires approval
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  
  # Ignore differences for certain fields in production
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas  # Allow manual scaling in production