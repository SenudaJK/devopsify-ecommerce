apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devopsify-dev
  namespace: argocd
  labels:
    environment: dev
    app.kubernetes.io/name: devopsify-ecommerce
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: devopsify-project
  source:
    repoURL: https://github.com/SenudaJK/devopsify-ecommerce.git
    targetRevision: dev
    path: gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: devopsify-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devopsify-staging
  namespace: argocd
  labels:
    environment: staging
    app.kubernetes.io/name: devopsify-ecommerce
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: devopsify-project
  source:
    repoURL: https://github.com/SenudaJK/devopsify-ecommerce.git
    targetRevision: master
    path: gitops/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: devopsify-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m