# Production Environment Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include the base configuration
resources:
- ../../base
- namespace-patch.yaml

# Override namespace for production
namespace: devopsify-prod

# Production-specific patches
patches:
- path: replicas-patch.yaml
  target:
    kind: Deployment
- path: resources-patch.yaml
  target:
    kind: Deployment

# Production-specific image tags (use specific semantic versions)
images:
- name: ghcr.io/senudajk/devopsify-backend
  newTag: v1.0.0
- name: ghcr.io/senudajk/devopsify-frontend
  newTag: v1.0.0

# Common labels for production resources
commonLabels:
  environment: production
  stage: prod
  managed-by: argocd
  criticality: high

# Environment labels
labels:
- pairs:
    environment: production
    stage: prod
  includeSelectors: false

# ConfigMap generator for production configs
configMapGenerator:
- name: app-config
  literals:
  - NODE_ENV=production
  - LOG_LEVEL=info
  - ENABLE_DEBUG=false

# Production replicas (high availability)
replicas:
- name: devopsify-backend
  count: 3
- name: devopsify-frontend
  count: 3