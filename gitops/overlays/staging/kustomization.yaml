# Staging Environment Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Include the base configuration
resources:
- ../../base
- namespace-patch.yaml

# Override namespace for staging
namespace: devopsify-staging

# Staging-specific image tags (use release candidates or master builds)
images:
- name: ghcr.io/senudajk/devopsify-backend
  newTag: staging
- name: ghcr.io/senudajk/devopsify-frontend
  newTag: staging

# Common labels for staging resources
commonLabels:
  environment: staging
  stage: staging
  managed-by: argocd

# Environment labels
labels:
- pairs:
    environment: staging
    stage: staging
  includeSelectors: false

# Patches for staging environment
patches:
- path: replicas-patch.yaml
  target:
    kind: Deployment

# ConfigMap generator for staging configs
configMapGenerator:
- name: app-config
  literals:
  - NODE_ENV=staging
  - LOG_LEVEL=info
  - ENABLE_DEBUG=false

# Staging replicas (mirrors production but smaller scale)
replicas:
- name: devopsify-backend
  count: 2
- name: devopsify-frontend
  count: 2
- target:
    group: apps
    version: v1
    kind: Deployment
    name: devopsify-frontend
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1